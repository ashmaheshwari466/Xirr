<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XIRR Calculator App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; color: #333; padding: 15px; }
        .app-container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f0f2f5; padding-bottom: 12px; }
        h1 { font-size: 20px; color: #1a73e8; }
        .badge { background: #e8f0fe; color: #1a73e8; font-size: 11px; padding: 4px 8px; border-radius: 20px; font-weight: 600; }
        .row-header { display: flex; font-size: 12px; font-weight: 600; color: #5f6368; margin-bottom: 6px; padding: 0 4px; }
        .row-header div:nth-child(1) { flex: 1.2; }
        .row-header div:nth-child(2) { flex: 1.3; margin-left: 8px; }
        .row-header div:nth-child(3) { width: 40px; text-align: center; }
        .cashflow-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; background: #f8f9fa; padding: 8px; border-radius: 10px; border: 1px solid #e1e4e8; }
        input[type="date"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccd0d5; border-radius: 8px; font-size: 14px; background: #fff; outline: none; }
        input:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }
        .cashflow-row > div:nth-child(1) { flex: 1.2; }
        .cashflow-row > div:nth-child(2) { flex: 1.3; }
        .btn-icon { background: #fee8e7; color: #d93025; border: none; width: 38px; height: 38px; border-radius: 8px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .btn-icon:hover { background: #fad2cf; }
        .btn-icon:disabled { opacity: 0.4; cursor: not-allowed; }
        .actions-bar { display: flex; gap: 10px; margin-top: 15px; }
        .btn { padding: 12px 16px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; }
        .btn-primary { background: #1a73e8; color: white; flex: 1; }
        .btn-primary:hover { background: #1557b0; }
        .btn-secondary { background: #e8f0fe; color: #1a73e8; }
        .btn-secondary:hover { background: #d2e3fc; }
        .btn-danger-text { background: transparent; color: #d93025; margin-left: auto; }
        .btn-danger-text:hover { background: #fee8e7; }
        .calc-btn { background: #34a853; color: white; width: 100%; margin-top: 15px; padding: 14px; font-size: 16px; border-radius: 10px; box-shadow: 0 4px 10px rgba(52,168,83,0.3); }
        .calc-btn:hover { background: #2d9249; }
        .result-card { margin-top: 20px; background: #e6f4ea; border: 1px solid #ceead6; padding: 16px; border-radius: 12px; text-align: center; display: none; }
        .result-title { font-size: 13px; color: #137333; font-weight: 600; margin-bottom: 4px; }
        .result-value { font-size: 24px; color: #0d652d; font-weight: bold; }
        .error-card { margin-top: 20px; background: #fce8e6; border: 1px solid #fad2cf; padding: 14px; border-radius: 12px; color: #c5221f; font-size: 14px; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div>
            <h1>📊 XIRR Calculator</h1>
            <div style="font-size: 11px; color: #5f6368; margin-top: 2px;">Private & Auto-Saving App</div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
            <span class="badge">100% Offline</span>
            <button class="btn btn-danger-text" onclick="resetData()" style="padding:6px 10px; font-size:12px;">Reset</button>
        </div>
    </div>

    <div class="row-header">
        <div>Date (Tarikhi)</div>
        <div>Amount (Rupaye [- / +])</div>
        <div></div>
    </div>

    <div id="cashflows-list"></div>

    <div class="actions-bar">
        <button class="btn btn-secondary" onclick="addRow()">+ Add Row</button>
    </div>

    <button class="btn calc-btn" onclick="calculateXIRR()">🚀 Calculate XIRR</button>

    <div id="resultCard" class="result-card">
        <div class="result-title">FINAL XIRR RETURN</div>
        <div id="resultValue" class="result-value">0.00%</div>
    </div>

    <div id="errorCard" class="error-card"></div>
</div>

<script>
    let defaultData = [
        {date: '2023-01-01', amount: -100000},
        {date: '2026-10-31', amount: 150000}
    ];

    function getData() {
        let saved = localStorage.getItem('my_xirr_app_data');
        return saved ? JSON.parse(saved) : defaultData;
    }

    function saveData(data) {
        localStorage.setItem('my_xirr_app_data', JSON.stringify(data));
    }

    function render() {
        let data = getData();
        let container = document.getElementById('cashflows-list');
        container.innerHTML = '';
        
        data.forEach((item, index) => {
            let row = document.createElement('div');
            row.className = 'cashflow-row';
            row.innerHTML = `
                <div>
                    <input type="date" value="${item.date}" onchange="updateRow(${index}, 'date', this.value)">
                </div>
                <div>
                    <input type="number" step="any" placeholder="Amount" value="${item.amount}" oninput="updateRow(${index}, 'amount', this.value)">
                </div>
                <div>
                    <button class="btn-icon" onclick="removeRow(${index})" ${data.length <= 2 ? 'disabled' : ''}>✕</button>
                </div>
            `;
            container.appendChild(row);
        });
    }

    function updateRow(index, field, value) {
        let data = getData();
        if (field === 'amount') {
            data[index][field] = value === '' ? '' : parseFloat(value);
        } else {
            data[index][field] = value;
        }
        saveData(data);
    }

    function addRow() {
        let data = getData();
        let lastDate = data.length > 0 ? data[data.length - 1].date : new Date().toISOString().split('T')[0];
        data.push({date: lastDate, amount: 0});
        saveData(data);
        render();
    }

    function removeRow(index) {
        let data = getData();
        if(data.length > 2) {
            data.splice(index, 1);
            saveData(data);
            render();
        }
    }

    function resetData() {
        if(confirm("Kya aap saara data reset karna chahte hain?")) {
            localStorage.removeItem('my_xirr_app_data');
            render();
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('errorCard').style.display = 'none';
        }
    }

    function calculateXIRR() {
        let data = getData();
        let cashflows = data.map(d => ({
            date: new Date(d.date),
            amount: parseFloat(d.amount)
        })).filter(d => !isNaN(d.date) && !isNaN(d.amount));

        let resCard = document.getElementById('resultCard');
        let errCard = document.getElementById('errorCard');
        resCard.style.display = 'none';
        errCard.style.display = 'none';

        if(cashflows.length < 2) {
            errCard.innerHTML = "⚠️ Kam se kam 2 valid entries honi zaroori hain.";
            errCard.style.display = 'block';
            return;
        }

        cashflows.sort((a, b) => a.date - b.date);

        let xirr = function(cfs) {
            let dates = cfs.map(c => c.date);
            let amounts = cfs.map(c => c.amount);
            let x0 = 0.1;
            let maxit = 100;
            let precision = 1e-7;

            let x = x0;
            for(let i = 0; i < maxit; i++) {
                let npv = 0;
                let dnpv = 0;
                let d0 = dates[0];
                for(let j = 0; j < cfs.length; j++) {
                    let days = (dates[j] - d0) / (1000 * 60 * 60 * 24);
                    let yearFrac = days / 365.0;
                    let denom = Math.pow(1 + x, yearFrac);
                    npv += amounts[j] / denom;
                    dnpv -= yearFrac * amounts[j] / (denom * (1 + x));
                }
                if(Math.abs(npv) < precision) return x;
                if(dnpv === 0) break;
                let xNew = x - npv / dnpv;
                if(Math.abs(xNew - x) < precision) return xNew;
                x = xNew;
            }
            return null;
        };

        let rate = xirr(cashflows);
        if(rate !== null) {
            document.getElementById('resultValue').innerText = (rate * 100).toFixed(2) + "%";
            resCard.style.display = 'block';
        } else {
            errCard.innerHTML = "❌ Calculation fail ho gayi. Kripya check karein ki ek negative aur ek positive amount ho.";
            errCard.style.display = 'block';
        }
    }

    window.onload = render;
</script>
</body>
</html>
